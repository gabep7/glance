name: release

# two ways to cut a release:
#   - actions tab -> release -> run workflow, pick patch/minor/major
#   - push a tag yourself: git tag -a v1.2.3 -m "notes" && git push origin v1.2.3
#     (an annotated tag's message becomes the release notes)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      bump:
        description: version bump
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable

      - run: nvim --headless -u NONE -l tests/run.lua

      - name: pick tag
        id: tag
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last=$(git tag -l 'v*' --sort=-v:refname | head -n1)
          IFS=. read -r major minor patch <<< "${last:-v0.0.0}"
          major=${major#v}
          case "$BUMP" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            *) patch=$((patch + 1)) ;;
          esac
          tag="v$major.$minor.$patch"
          git tag "$tag"
          git push origin "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if [ "$(git cat-file -t "$TAG")" = "tag" ]; then
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-from-tag
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes
          fi
